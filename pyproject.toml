[project]
name = "ur-modbus-tcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dong82won", email = "2dongwon@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "opencv-python<5.0.0",
    "pupil-apriltags>=1.0.4.post11",
    "pymodbus>=3.16.2",
    "pyrealsense2>=2.59.2.11152",
    "scipy>=1.18.1",
]

[project.scripts]
server = "ur_modbus_tcp.pc2_server2:run"
client = "ur_modbus_tcp.pc1_client:run"


[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/ur_modbus_tcp"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
